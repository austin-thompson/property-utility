services:
  api:
    build: .
    command: uvicorn property_utility.api.app:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
      - .env.example
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-property_utility}
      POSTGRES_USER: ${POSTGRES_USER:-property}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-property}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-property} -d ${POSTGRES_DB:-property_utility}"]
      interval: 10s
      timeout: 5s
      retries: 5
